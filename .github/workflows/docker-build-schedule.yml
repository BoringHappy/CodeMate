name: Scheduled CodeMate Image Rebuild

on:
  schedule:
    # Rebuild every day at 00:00 UTC.
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  trigger-build:
    runs-on: ubuntu-24.04
    permissions:
      actions: write

    steps:
      - name: Trigger Docker build
        uses: actions/github-script@v7
        with:
          script: |
            for (const workflow_id of ['docker-build.yml', 'docker-build-pure.yml']) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id,
                ref: 'main'
              });
              console.log(`Triggered scheduled rebuild: ${workflow_id}`);
            }
