name: Scheduled CodeMate Image Rebuild

on:
  schedule:
    # Rebuild every day at 05:00 UTC.
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  trigger-build:
    runs-on: ubuntu-24.04
    permissions:
      actions: write

    steps:
      - name: Trigger Docker build
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'docker-build.yml',
              ref: 'main'
            });
            console.log('Triggered scheduled CodeMate image rebuild');
