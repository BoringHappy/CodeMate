name: Build Base Image (PR Check)

on:
  pull_request:
    paths:
      - 'docker/Dockerfile.base'
      - '.github/workflows/docker-build-base-check.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build base image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile.base
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: codemate-base:pr-check
          cache-from: type=gha,scope=base-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=base-check-${{ matrix.arch }}
          provenance: false

      - name: Smoke test — required tools present and runnable
        run: |
          set -euxo pipefail
          docker run --rm codemate-base:pr-check bash -euxc '
            buildah --version
            skopeo --version
            fuse-overlayfs --version
            newuidmap --help >/dev/null 2>&1 || newuidmap 2>&1 | head -1
            kubectl version --client --output=yaml
            helm version --short
            test -s /etc/containers/storage.conf
            grep -q "fuse-overlayfs" /etc/containers/storage.conf
            grep -q "^agent:" /etc/subuid
            grep -q "^agent:" /etc/subgid
          '
