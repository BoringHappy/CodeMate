name: Build Base Image (PR Check)

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (amd64)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            base:
              - 'docker/Dockerfile.base'
              - '.github/workflows/docker-build-base-check.yml'

      - name: Skip — no Dockerfile.base changes
        if: steps.filter.outputs.base != 'true'
        run: echo "No relevant changes; reporting success without building."

      - name: Set up Docker Buildx
        if: steps.filter.outputs.base == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build base image (no push)
        if: steps.filter.outputs.base == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile.base
          platforms: linux/amd64
          push: false
          load: true
          tags: codemate-base:pr-check
          cache-from: type=gha,scope=base-amd64
          cache-to: type=gha,mode=max,scope=base-check-amd64
          provenance: false

      - name: Smoke test — required tools present and runnable
        if: steps.filter.outputs.base == 'true'
        run: |
          set -euxo pipefail
          docker run --rm codemate-base:pr-check bash -euxc '
            kubectl version --client --output=yaml
            helm version --short
          '
