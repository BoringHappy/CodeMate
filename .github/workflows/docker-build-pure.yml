name: Build and Push CodeMate Pure Image

on:
  pull_request:
    paths:
      - '.github/workflows/docker-build-pure.yml'
      - 'docker/Dockerfile.pure'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/docker-build-pure.yml'
      - 'docker/Dockerfile.pure'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-pure" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile.pure
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            codemate-pure:pr-check
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          cache-from: type=gha,scope=pure-amd64
          cache-to: type=gha,mode=max,scope=pure-amd64
          provenance: false

      - name: Smoke test — zsh and both agents are runnable
        if: github.event_name == 'pull_request'
        run: |
          set -euxo pipefail
          docker run --rm codemate-pure:pr-check zsh -lc 'command -v zsh && claude --version && codex --version'
