# CodeMate tmux configuration
# Tuned for modern terminal emulators (iTerm2, Ghostty, WezTerm, Kitty).

# Mouse support: enables scroll wheel, pane click, drag-to-resize.
set -g mouse on

# Forward terminal focus-in/focus-out events to inner applications.
# Without this, Claude Code emits a "focus-events off" warning.
set -g focus-events on

# Disable Kitty Keyboard Protocol forwarding entirely. With it on, tmux
# re-encodes C-j (the LF byte in pasted newlines) as a CSI u sequence,
# which Claude Code does not parse and renders as a stray 'j' between
# pasted lines.
set -s extended-keys off

# Recognize the outer terminal's Shift+Enter (CSI u: \e[13;2u) as a
# user-defined key and rewrite it to Alt+Enter (\e\r), which Claude Code
# interprets as inserting a newline. user-keys are parsed regardless of
# extended-keys, so this restores Shift+Enter without re-introducing the
# paste corruption.
set -s user-keys[0] "\033[13;2u"
bind-key -T root User0 send-keys M-Enter

# Forward tmux copy-mode yanks to the host terminal's system clipboard via
# OSC 52, so text yanked inside tmux is immediately pasteable outside it.
set -s set-clipboard on
