[project]
name = "codemate-cli"
version = "0.1.0"
description = "CodeMate container and host agent workflows"
requires-python = ">=3.9"
dependencies = [
  "rich>=13.0",
  "typer>=0.12",
]

[project.scripts]
codemate = "cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli"]

[tool.hatch.build.targets.wheel.force-include]
"plugins" = "cli/resources/plugins"
"docker/setup/prompt/system_prompt.txt" = "cli/resources/system_prompt.txt"
